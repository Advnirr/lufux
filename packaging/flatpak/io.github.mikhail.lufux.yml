app-id: io.github.mikhail.lufux
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: lufux
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # disks are opened and listed through udisks, polkit asks the password
  - --system-talk-name=org.freedesktop.UDisks2
  # where udisks mounts the stick and the ISO: /run/media, /media on Debian
  - --filesystem=/run/media
  - --filesystem=/media
modules:
  - name: wimlib
    config-opts:
      - --without-ntfs-3g
      - --without-fuse
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.la'
    sources:
      - type: archive
        url: https://wimlib.net/downloads/wimlib-1.14.5.tar.gz
        sha256: 84221a3abd5b91228f15f8e6065c335a336237b5738197b75bf419eea561a194

  # BIOS boot for MBR media: grub-mkimage, grub-bios-setup and the i386-pc modules
  - name: grub
    # GRUB brings its own flags for the boot code; the SDK's, or even a plain
    # -O2 on top, give a core.img that crashes after "GRUB loading."
    build-options:
      cflags: ''
      cflags-override: true
      ldflags: ''
      ldflags-override: true
    # with --image-base the SDK's ld puts the ELF headers in front of
    # kernel.img, and grub-mkimage refuses it
    make-args:
      - TARGET_IMG_BASE_LDOPT=-Wl,-Ttext
    make-install-args:
      - TARGET_IMG_BASE_LDOPT=-Wl,-Ttext
    config-opts:
      - --with-platform=pc
      - --target=i386
      - --disable-werror
      - --disable-nls
      - --disable-grub-mkfont
      - --disable-grub-themes
      - --disable-grub-mount
      - --disable-device-mapper
      - --disable-libzfs
    cleanup:
      - /etc
      - /include
      - /share/info
      - /share/man
      - /share/grub
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/grub/grub-2.14.tar.xz
        sha256: bc8d3c73535b8838d8c8e2654d73edc4e6ae8c8acdb45d5df5dc9a1547446d43

  - name: lufux
    buildsystem: simple
    build-commands:
      - install -Dm755 main.py /app/share/lufux/main.py
      - for m in *_logic.py; do install -Dm644 "$m" "/app/share/lufux/$m"; done
      - printf '#!/bin/sh\nexec python3 /app/share/lufux/main.py "$@"\n' > lufux
      - install -Dm755 lufux /app/bin/lufux
      - install -Dm644 io.github.mikhail.lufux.desktop /app/share/applications/io.github.mikhail.lufux.desktop
      - desktop-file-edit --set-key=Exec --set-value=lufux --set-icon=io.github.mikhail.lufux
        /app/share/applications/io.github.mikhail.lufux.desktop
      - install -Dm644 lufux.svg /app/share/icons/hicolor/scalable/apps/io.github.mikhail.lufux.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - build-dir
